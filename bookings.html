<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04130c" />
  <title>Bookings — Leo Academy</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/glass.css?v=22" />
  <script>document.documentElement.dataset.theme = localStorage.getItem("lt-theme") || "dark"; document.documentElement.classList.add("lt-js");</script>
  <style>
    .req-tray { display: flex; flex-direction: column; gap: 8px; }
    .req-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px;
      border: 1px solid rgba(215,239,79,.35); background: rgba(215,239,79,.07); border-radius: var(--r-md); }
    .req-row .rq-who { font-weight: 700; color: var(--ink-hi); font-size: 13.5px; }
    .req-row .rq-what { font-size: 12.5px; color: var(--ink-mid); }
    .req-row .rq-amt { font-weight: 700; color: var(--tx-gold); font-size: 13px; }

    /* channels split */
    .ch-bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; gap: 2px; }
    .ch-bar i { display: block; height: 100%; transform-origin: left; animation: lt-fill-bar .8s var(--ease-spring) both; }
    .ch-bar .c-Website { background: var(--gold-grad); }
    .ch-bar .c-Playo { background: linear-gradient(115deg, #6ee7b7, #34d399); }
    .ch-bar .c-Hudle { background: linear-gradient(115deg, #e7f97e, #d7ef4f); }
    .ch-bar .c-Walk-in { background: rgba(255, 255, 255, 0.3); }
    :root[data-theme="light"] .ch-bar .c-Walk-in { background: rgba(20, 50, 34, 0.3); }
    .ch-legend { display: flex; gap: 8px 18px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--ink-mid); }
    .ch-legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .ch-legend b { color: var(--ink-hi); }

    .tl-legend .sw-free { background: rgba(255, 255, 255, 0.16); }
    :root[data-theme="light"] .tl-legend .sw-free { background: rgba(20, 50, 34, 0.16); }
  </style>
</head>
<body>
  <div class="lt-bg" aria-hidden="true"></div>

  <main class="lt-page">
    <div class="card-head" style="margin-bottom: 0;">
      <div>
        <div class="kicker">Court Bookings</div>
        <h2>Courts at a glance</h2>
        <div class="sub" id="dayLine"></div>
      </div>
      <div class="flex wrap">
        <input type="date" id="bkDate" style="width:auto;" />
        <span class="pill gold" id="dayStats">—</span>
        <button class="btn btn-primary btn-sm" id="addBkBtn">+ Add booking</button>
      </div>
    </div>

    <!-- booking channels, last 30 days -->
    <div class="glass glass-card tight reveal">
      <div class="card-head" style="margin-bottom: 10px;">
        <div><div class="kicker">Channels</div><h2 style="font-size:16px;">Bookings by source · last 30 days</h2></div>
        <span class="faint" style="font-size:11.5px;">Playo &amp; Hudle sync pending — staff add those manually</span>
      </div>
      <div class="ch-bar" id="chBar"></div>
      <div class="ch-legend" id="chLegend"></div>
    </div>

    <!-- unassigned web requests -->
    <div class="glass glass-card tight hide" id="reqCard">
      <div class="card-head" style="margin-bottom: 10px;">
        <div><div class="kicker">New requests</div><h2 style="font-size:16px;">Waiting for a court</h2></div>
      </div>
      <div class="req-tray" id="reqTray"></div>
    </div>

    <!-- sport filter -->
    <div class="chip-row" id="sportChips" style="justify-content:center;">
      <button class="chip active" data-s="all">All courts · 9</button>
      <button class="chip" data-s="tennis">Tennis · 5</button>
      <button class="chip" data-s="pickleball">Pickleball · 4</button>
    </div>

    <!-- court photo grid -->
    <div class="court-grid" id="courtGrid"></div>

    <div class="tl-legend glass glass-card tight" style="justify-content:center;">
      <span><span class="sw" style="background:linear-gradient(115deg,#f0d795,#c9a24b);"></span>Booked</span>
      <span><span class="sw" style="background:repeating-linear-gradient(45deg, rgba(215,239,79,.55) 0 4px, rgba(215,239,79,.12) 4px 8px);"></span>Pending</span>
      <span><span class="sw sw-free"></span>Free</span>
      <span><span class="sw sw-free" style="opacity:.3;"></span>Past</span>
    </div>
  </main>

  <!-- add booking modal (manual entry, incl. Playo/Hudle until APIs land) -->
  <div class="lt-modal-backdrop" id="abBackdrop">
    <div class="glass lt-modal">
      <div class="modal-head">
        <div><div class="kicker">Add booking</div><h2 style="font-size:20px;">Record a court booking</h2></div>
        <button class="btn btn-icon btn-ghost" id="abClose">✕</button>
      </div>
      <form id="abForm" class="lt-grid" style="gap: var(--gap-3);">
        <label class="field"><span>Booked by</span><input type="text" name="name" placeholder="Name / company" required /></label>
        <div class="lt-grid cols-2" style="gap: var(--gap-2);">
          <label class="field"><span>Phone <span class="opt">(optional)</span></span><input type="tel" name="phone" placeholder="98xxxxxxxx" /></label>
          <label class="field"><span>Source</span><select name="source" id="abSource"></select></label>
        </div>
        <div class="lt-grid cols-2" style="gap: var(--gap-2);">
          <label class="field"><span>Date</span><input type="date" name="date" id="abDate" /></label>
          <label class="field"><span>Hour slot</span><select name="hour" id="abHour"></select></label>
        </div>
        <div class="lt-grid cols-2" style="gap: var(--gap-2);">
          <label class="field"><span>Sport</span><select name="sport" id="abSport2"><option value="tennis">Tennis</option><option value="pickleball">Pickleball</option></select></label>
          <label class="field"><span>Court</span><select name="court" id="abCourt"><option value="">Auto-assign</option></select></label>
        </div>
        <div class="form-msg" id="abMsg" style="min-height:0;"></div>
        <button class="btn btn-primary btn-block" type="submit">Save booking</button>
      </form>
    </div>
  </div>

  <!-- court schedule modal -->
  <div class="lt-modal-backdrop" id="cmBackdrop">
    <div class="glass lt-modal court-modal" id="cmModal">
      <div class="cm-hero">
        <img id="cmPhoto" src="" alt="" />
        <div class="cm-title"><div class="sub" id="cmSub"></div><h2 id="cmName"></h2></div>
        <button class="btn btn-icon btn-ghost cm-close" id="cmClose">✕</button>
      </div>
      <div class="cm-body">
        <div class="flex between wrap">
          <span class="pill gold" id="cmSummary"></span>
          <span class="faint" style="font-size:12px;" id="cmDate"></span>
        </div>
        <div class="sched" id="cmSched"></div>
      </div>
    </div>
  </div>

  <script src="assets/js/core.js?v=22"></script>
  <script src="assets/js/data.js?v=22"></script>
  <script src="assets/js/cloud.js?v=22"></script>
  <script>
    LT.auth.require();
    LT.managerShell("bookings.html");

    (function () {
      var dateInput = document.getElementById("bkDate");
      dateInput.value = LT.today();
      var openCourt = null;

      function overrides() { return LT.store.read("booking-status", {}); }

      var sportFilter = "all";

      // booking channels come from the platform MASTER LIST (get_channels);
      // add a channel in the DB once and it appears here, in the add-booking
      // form and the channel chart. Fallback list keeps parity offline.
      var CHANNELS = [
        { id: "Website", label: "Website", color: "#e8c268" },
        { id: "Playo", label: "Playo", color: "#34d399" },
        { id: "Hudle", label: "Hudle", color: "#cbe34f" },
        { id: "District", label: "District", color: "#60a5fa" },
        { id: "Walk-in", label: "Walk-in", color: "#9aa3b2" },
      ];
      function chColor(id) { var c = CHANNELS.find(function (x) { return x.id === id; }); return c ? c.color : "#9aa3b2"; }

      // cloud ledger — bookings recorded on any device join the local view
      var cloudBookings = [];
      if (window.LT_CLOUD) {
        var since = new Date(); since.setDate(since.getDate() - 31);
        LT_CLOUD.fetchBookings(LT.isoDate(since)).then(function (rows) {
          if (rows && rows.length) { cloudBookings = rows; render(); paintChannels(); }
        });
        LT_CLOUD.fetchChannels().then(function (list) {
          if (list && list.length) { CHANNELS = list; buildSourceSelect(); paintChannels(); }
        });
      }

      function allBookings() {
        var ov = overrides();
        var local = LT.store.read("bookings", []).concat(LT_DATA.bookings);
        var seen = {};
        local.forEach(function (b) { seen[b.id] = 1; });
        return local.concat(cloudBookings.filter(function (b) { return !seen[b.id]; })).map(function (b) {
          var o = Object.assign({}, b, ov[b.id] ? { status: ov[b.id], court: ov[b.id + ":court"] || b.court } : {});
          o.court = LT_SLOTS.courtId(o.court);
          if (!o.sport) o.sport = o.court && o.court[0] === "P" ? "pickleball" : "tennis";
          return o;
        });
      }

      function dayBookings() {
        return allBookings().filter(function (b) { return b.date === dateInput.value; });
      }

      function hourLabelShort(h) { var ap = h >= 12 ? "PM" : "AM"; var v = h % 12 || 12; return v + ap; }

      function statusOfCourt(list, nowH, isToday) {
        var inPlay = isToday && list.find(function (b) { return b.hour === nowH && b.status === "confirmed"; });
        if (inPlay) return { cls: "gold", label: "In play · till " + hourLabelShort(inPlay.hour + 1) };
        var next = list.filter(function (b) { return !isToday || b.hour > nowH; }).sort(function (a, b) { return a.hour - b.hour; })[0];
        if (next) return { cls: "green", label: (isToday ? "Free · next " : "First booking ") + hourLabelShort(next.hour) };
        return { cls: "green", label: "Free all day" };
      }

      function srcPill(src, small) {
        if (!src) return "";
        return '<span class="pill"' + (small ? ' style="font-size:10px;padding:2px 9px;"' : "") +
          '><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' + chColor(src) + ';margin-right:5px;vertical-align:0;"></span>' + LT.esc(src) + "</span>";
      }

      function paintChannels() {
        var cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
        var iso = LT.isoDate(cutoff);
        var counts = {};
        CHANNELS.forEach(function (c) { counts[c.id] = 0; });
        allBookings().forEach(function (b) {
          if (b.date >= iso && b.date <= LT.today() && counts[b.source || "Website"] !== undefined) counts[b.source || "Website"]++;
        });
        var total = Object.keys(counts).reduce(function (s, k) { return s + counts[k]; }, 0) || 1;
        document.getElementById("chBar").innerHTML = CHANNELS.map(function (c, i) {
          var pct = (counts[c.id] / total) * 100;
          return '<i style="width:' + pct + '%;background:' + c.color + ';animation-delay:' + (i * 90) + 'ms;" title="' + LT.esc(c.label) + ": " + counts[c.id] + '"></i>';
        }).join("");
        document.getElementById("chLegend").innerHTML = CHANNELS.map(function (c) {
          return '<span><span class="sw" style="background:' + c.color + ';"></span>' + LT.esc(c.label) + " <b>" + counts[c.id] + "</b></span>";
        }).join("");
      }

      function render() {
        var day = dayBookings();
        var isToday = dateInput.value === LT.today();
        var nowH = new Date().getHours();
        var hours = [];
        for (var h = LT_DATA.slotHours.open; h < LT_DATA.slotHours.close; h++) hours.push(h);

        document.getElementById("dayLine").textContent =
          new Date(dateInput.value).toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        var pending = day.filter(function (b) { return b.status === "pending"; }).length;
        var revenue = day.reduce(function (s, b) { return s + b.amount; }, 0);
        document.getElementById("dayStats").textContent =
          day.length + " bookings · " + pending + " pending · " + LT.fmtINR(revenue);

        // requests without a court yet
        var waiting = day.filter(function (b) { return !b.court && b.status === "pending"; });
        document.getElementById("reqCard").classList.toggle("hide", waiting.length === 0);
        document.getElementById("reqTray").innerHTML = waiting.map(function (b) {
          return '<div class="req-row"><span class="rq-who">' + LT.esc(b.name) + "</span>" +
            '<span class="rq-what">' + LT_SLOTS.label(b.hour) + (b.phone ? " · " + LT.esc(b.phone) : "") + "</span>" +
            srcPill(b.source, true) +
            '<span class="grow"></span><span class="rq-amt">' + LT.fmtINR(b.amount) + "</span>" +
            '<button class="btn btn-primary btn-sm" data-confirm="' + b.id + '">Confirm &amp; assign</button></div>';
        }).join("");

        // court cards
        var courts = LT_DATA.courtsMeta.filter(function (c) { return sportFilter === "all" || c.sport === sportFilter; });
        document.getElementById("courtGrid").innerHTML = courts.map(function (c, ci) {
          var list = day.filter(function (b) { return b.court === c.id; });
          var booked = list.filter(function (b) { return b.status === "confirmed"; }).length;
          var earn = list.reduce(function (s, b) { return s + (b.status === "confirmed" ? b.amount : 0); }, 0);
          var st = statusOfCourt(list, nowH, isToday);

          var segs = hours.map(function (h, i) {
            var b = list.find(function (x) { return x.hour === h; });
            var cls = "seg";
            if (b) cls += b.status === "confirmed" ? " booked" : " pending";
            if (isToday && h < nowH) cls += " past";
            if (isToday && h === nowH) cls += " now";
            return '<span class="' + cls + '" style="animation-delay:' + (ci * 90 + i * 22) + 'ms;"></span>';
          }).join("");

          return '<div class="court-card" data-court="' + c.id + '">' +
            '<div class="cc-media">' +
            '<img class="cc-photo" src="' + c.img + '" alt="' + c.name + '" loading="lazy" />' +
            '<div class="cc-shade"></div>' +
            '<span class="cc-status"><span class="pill ' + st.cls + '">' + st.label + "</span></span>" +
            '<div class="cc-name">' + c.name + "<small>" + LT_DATA.sports[c.sport].label + " · " + c.note + "</small></div>" +
            "</div>" +
            '<div class="cc-body">' +
            '<div class="tl">' + segs + "</div>" +
            '<div class="tl-hours"><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>11 PM</span></div>' +
            '<div class="cc-meta"><span><b>' + booked + "</b> of " + hours.length + " hours booked</span><span><b>" + LT.fmtINR(earn) + "</b> confirmed</span></div>" +
            "</div></div>";
        }).join("");

        if (openCourt) paintModal();
      }

      /* ---------- modal ---------- */
      var backdrop = document.getElementById("cmBackdrop");

      function paintModal() {
        var c = LT_DATA.courtsMeta.find(function (x) { return x.id === openCourt; });
        var day = dayBookings().filter(function (b) { return b.court === c.id; });
        var isToday = dateInput.value === LT.today();
        var nowH = new Date().getHours();

        document.getElementById("cmPhoto").src = c.img;
        document.getElementById("cmName").textContent = c.name;
        document.getElementById("cmSub").textContent = LT_DATA.sports[c.sport].label + " · " + c.note;
        document.getElementById("cmDate").textContent =
          new Date(dateInput.value).toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" });
        var booked = day.filter(function (b) { return b.status === "confirmed"; });
        document.getElementById("cmSummary").textContent =
          booked.length + " hour" + (booked.length === 1 ? "" : "s") + " booked · " +
          LT.fmtINR(booked.reduce(function (s, b) { return s + b.amount; }, 0));

        var rows = [];
        for (var h = LT_DATA.slotHours.open, i = 0; h < LT_DATA.slotHours.close; h++, i++) {
          var b = day.find(function (x) { return x.hour === h; });
          var cls = "sched-row " + (b ? b.status === "confirmed" ? "booked" : "pending" : "free");
          if (isToday && h < nowH) cls += " past";
          if (isToday && h === nowH) cls += " now";
          var who = b
            ? '<span class="sr-who">' + LT.esc(b.name) + "<small>" + LT.fmtINR(b.amount) + " · " + LT.esc(b.source || "Website") +
                (b.phone ? " · " + LT.esc(b.phone) : "") + (b.status === "pending" ? " · pending" : "") + "</small></span>"
            : '<span class="sr-who">Free · ' + LT.fmtINR(LT_SLOTS.rate(h, c.sport)) + "</span>";
          // one-off booker? staff can reach them to confirm they'll show up
          var waBtn = b && b.phone
            ? '<a class="btn btn-icon btn-glass btn-sm" href="https://wa.me/91' + String(b.phone).replace(/\D/g, "").slice(-10) + '" target="_blank" rel="noopener" aria-label="Message ' + LT.esc(b.name) + '" title="Message ' + LT.esc(b.name) + '"><svg viewBox="0 0 24 24" fill="currentColor" style="width:15px;height:15px;"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.47-2.4-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.44-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35z"/></svg></a>'
            : "";
          var act = (b && b.status === "pending"
            ? '<button class="btn btn-glass btn-sm" data-confirm="' + b.id + '">Confirm</button>' : "") + waBtn;
          rows.push('<div class="' + cls + '" style="animation-delay:' + i * 28 + 'ms;">' +
            '<span class="sr-time">' + LT_SLOTS.label(h) + "</span>" +
            '<span class="sr-bar"><i style="animation-delay:' + (i * 28 + 120) + 'ms;"></i></span>' +
            who + act + "</div>");
        }
        document.getElementById("cmSched").innerHTML = rows.join("");
      }

      document.getElementById("sportChips").addEventListener("click", function (e) {
        var btn = e.target.closest(".chip");
        if (!btn) return;
        sportFilter = btn.dataset.s;
        this.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("active", c === btn); });
        render();
      });

      document.getElementById("courtGrid").addEventListener("click", function (e) {
        var card = e.target.closest(".court-card");
        if (!card) return;
        openCourt = card.dataset.court;
        paintModal();
        backdrop.classList.add("open");
      });
      document.getElementById("cmClose").addEventListener("click", function () { backdrop.classList.remove("open"); openCourt = null; });
      backdrop.addEventListener("click", function (e) { if (e.target === backdrop) { backdrop.classList.remove("open"); openCourt = null; } });

      /* confirm actions (tray + modal) — the DATABASE claims the court
         atomically; two phones can no longer double-assign a slot */
      function confirmLocally(id) { // demo seeds only exist in this browser
        var ov = overrides();
        ov[id] = "confirmed";
        var b = allBookings().find(function (x) { return x.id === id; });
        if (b && !b.court) {
          var used = allBookings().filter(function (x) { return x.date === b.date && x.hour === b.hour && x.court; })
            .map(function (x) { return x.court; });
          var pool = LT_SLOTS.courtsOf(b.sport || "tennis");
          for (var ci = 0; ci < pool.length; ci++) {
            if (used.indexOf(pool[ci].id) === -1) { ov[id + ":court"] = pool[ci].id; break; }
          }
        }
        LT.store.write("booking-status", ov);
      }
      document.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-confirm]");
        if (!btn) return;
        var id = btn.dataset.confirm;
        btn.disabled = true;
        LT_CLOUD.confirmBooking(id).then(function (res) {
          var ov = overrides();
          ov[id] = "confirmed";
          if (res && res.court) ov[id + ":court"] = res.court;
          LT.store.write("booking-status", ov);
          LT.toast("Confirmed" + (res && res.court ? " · " + res.court : "") + " ✓");
          render();
        }).catch(function (err) {
          btn.disabled = false;
          var m = String(err.message || "");
          if (/unknown booking/.test(m)) { confirmLocally(id); LT.toast("Booking confirmed ✓"); render(); return; }
          LT.toast(/all courts taken/.test(m) ? "No free court left for that hour"
            : /no connection/.test(m) ? "No connection — not confirmed, try again"
            : "Couldn't confirm: " + m);
        });
      });

      /* ---------- manual add booking ---------- */
      var abBackdrop = document.getElementById("abBackdrop");
      function buildSourceSelect() {
        document.getElementById("abSource").innerHTML = CHANNELS
          .map(function (c) { return "<option" + (c.id === "Walk-in" ? " selected" : "") + ">" + c.id + "</option>"; }).join("");
      }
      buildSourceSelect();
      document.getElementById("abHour").innerHTML = LT_SLOTS.hours
        .map(function (h) { return '<option value="' + h + '">' + LT_SLOTS.label(h) + (h >= LT_DATA.rates.peakFrom ? " · peak" : "") + "</option>"; }).join("");
      var courtSel = document.getElementById("abCourt");
      var abSport2 = document.getElementById("abSport2");
      function fillCourtSel() {
        courtSel.innerHTML = '<option value="">Auto-assign</option>' +
          LT_SLOTS.courtsOf(abSport2.value).map(function (c) {
            return '<option value="' + c.id + '">' + c.name + "</option>";
          }).join("");
      }
      abSport2.addEventListener("change", fillCourtSel);
      fillCourtSel();
      document.getElementById("addBkBtn").addEventListener("click", function () {
        document.getElementById("abDate").value = dateInput.value;
        abBackdrop.classList.add("open");
      });
      document.getElementById("abClose").addEventListener("click", function () { abBackdrop.classList.remove("open"); });
      abBackdrop.addEventListener("click", function (e) { if (e.target === abBackdrop) abBackdrop.classList.remove("open"); });

      document.getElementById("abForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var d = new FormData(this);
        var msg = document.getElementById("abMsg");
        if (!String(d.get("name") || "").trim()) { msg.textContent = "Please enter who booked."; msg.className = "form-msg error"; return; }
        var hour = +d.get("hour"), date = d.get("date") || dateInput.value;
        var sport = d.get("sport") || "tennis";
        var form = this;
        // the RPC prices the slot and claims a court atomically server-side
        LT_CLOUD.recordBooking({
          name: d.get("name"), phone: d.get("phone") || "",
          sport: sport, date: date, hour: hour,
          source: d.get("source"), court: d.get("court") || null,
        }).then(function (res) {
          var list = LT.store.read("bookings", []);
          list.unshift({
            id: res.id, name: d.get("name"), phone: d.get("phone") || "",
            court: res.court, sport: sport, date: date, hour: hour,
            amount: LT_SLOTS.rate(hour, sport), status: "confirmed",
            source: d.get("source"),
          });
          LT.store.write("bookings", list);
          LT_CLOUD.track("staff_booking_added", { source: d.get("source"), sport: sport });
          abBackdrop.classList.remove("open");
          form.reset();
          var cn = LT_DATA.courtsMeta.find(function (x) { return x.id === res.court; });
          LT.toast("Booking saved · " + (cn ? cn.name : res.court) + " ✓");
          dateInput.value = date;
          render();
          paintChannels();
        }).catch(function (err) {
          var m = String(err.message || "");
          msg.textContent = /all courts taken/.test(m) ? "All " + sport + " courts are taken for that hour."
            : /no connection/.test(m) ? "No connection — booking NOT saved. Try again."
            : "Couldn't save: " + m;
          msg.className = "form-msg error";
        });
      });

      dateInput.addEventListener("change", render);
      render();
      paintChannels();
    })();
  </script>
</body>
</html>
