<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04130c" />
  <title>Finance — Leo Tennis Academy</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/glass.css?v=3" />
  <script>document.documentElement.dataset.theme = localStorage.getItem("lt-theme") || "dark"; document.documentElement.classList.add("lt-js");</script>
</head>
<body>
  <div class="lt-bg" aria-hidden="true"></div>

  <main class="lt-page">
    <div class="card-head" style="margin-bottom: 0;">
      <div>
        <div class="kicker">Finance</div>
        <h2>Revenue &amp; payments</h2>
        <div class="sub" id="monthLine"></div>
      </div>
      <button class="btn btn-primary btn-sm" id="recBtn">+ Record payment</button>
    </div>

    <div class="lt-grid cols-3">
      <div class="glass glass-hover stat-card reveal">
        <span class="stat-copy">Collected · last 30 days</span>
        <span class="stat-value" id="kpiTotal">—</span>
      </div>
      <div class="glass glass-hover stat-card reveal d1">
        <span class="stat-copy">Court revenue share</span>
        <span class="stat-value" id="kpiCourt">—</span>
      </div>
      <div class="glass glass-hover stat-card reveal d2">
        <span class="stat-copy">Renewals pending</span>
        <span class="stat-value" id="kpiPend">—</span>
      </div>
    </div>

    <div class="glass">
      <div class="card-head" style="padding: var(--gap-3) var(--gap-3) 0;">
        <div><div class="kicker">Ledger</div><h2 style="font-size:18px;">Recent payments</h2></div>
        <div class="chip-row" id="typeChips">
          <button class="chip active" data-t="all">All</button>
          <button class="chip" data-t="Membership">Memberships</button>
          <button class="chip" data-t="Court">Court bookings</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="lt-table">
          <thead><tr><th>Paid by</th><th>Type</th><th>Detail</th><th>Amount</th><th>Mode</th><th>Date</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- record payment modal -->
  <div class="lt-modal-backdrop" id="payBackdrop">
    <div class="glass lt-modal">
      <div class="modal-head">
        <div><div class="kicker">Record payment</div><h2 style="font-size:20px;">New entry</h2></div>
        <button class="btn btn-icon btn-ghost" id="payClose">✕</button>
      </div>
      <form id="payForm" class="lt-grid" style="gap: var(--gap-3);">
        <label class="field"><span>Member</span><select name="member" id="paySel"></select></label>
        <label class="field"><span>Plan</span>
          <div class="chip-row" id="planChips"></div>
        </label>
        <label class="field"><span>Amount</span><input type="number" name="amount" id="payAmt" /></label>
        <label class="field"><span>Mode</span><select name="mode"><option>UPI</option><option>Cash</option><option>Bank transfer</option></select></label>
        <button class="btn btn-primary btn-block" type="submit">Save payment</button>
      </form>
    </div>
  </div>

  <script src="assets/js/core.js?v=3"></script>
  <script src="assets/js/data.js?v=3"></script>
  <script>
    LT.auth.require();
    LT.managerShell("fees.html");

    (function () {
      var typeFilter = "all";
      document.getElementById("monthLine").textContent =
        new Date().toLocaleDateString("en-IN", { month: "long", year: "numeric" });

      function allPayments() {
        return LT.store.read("payments", []).concat(LT_DATA.payments);
      }

      function fmtD(iso) { return new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short" }); }

      function paintKPIs() {
        var all = allPayments();
        var total = all.reduce(function (s, p) { return s + p.amount; }, 0);
        var court = all.filter(function (p) { return p.type === "Court"; })
          .reduce(function (s, p) { return s + p.amount; }, 0);
        var due = LT_DATA.members.filter(function (m) { return m.status === "due"; }).length;
        LT.countUp(document.getElementById("kpiTotal"), total, { prefix: "₹" });
        LT.countUp(document.getElementById("kpiCourt"), court, { prefix: "₹" });
        document.getElementById("kpiPend").textContent = due + " members";
      }

      function render() {
        var list = allPayments().filter(function (p) { return typeFilter === "all" || p.type === typeFilter; });
        document.getElementById("rows").innerHTML = list.map(function (p) {
          var typePill = p.type === "Court"
            ? '<span class="pill optic">Court</span>'
            : '<span class="pill gold">Membership</span>';
          return "<tr><td class='t-name'>" + p.name + "</td><td>" + typePill + "</td>" +
            "<td class='faint'>" + (p.detail || "—") + "</td>" +
            "<td class='num gold' style='font-weight:700;'>" + LT.fmtINR(p.amount) + "</td>" +
            "<td><span class='pill'>" + p.mode + "</span></td><td>" + fmtD(p.on) + "</td></tr>";
        }).join("") || '<tr><td colspan="6"><div class="empty-state">No payments recorded yet.</div></td></tr>';
      }

      document.getElementById("typeChips").addEventListener("click", function (e) {
        var btn = e.target.closest(".chip");
        if (!btn) return;
        typeFilter = btn.dataset.t;
        this.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("active", c === btn); });
        render();
      });

      // record payment modal
      var backdrop = document.getElementById("payBackdrop");
      document.getElementById("recBtn").addEventListener("click", function () { backdrop.classList.add("open"); });
      document.getElementById("payClose").addEventListener("click", function () { backdrop.classList.remove("open"); });
      backdrop.addEventListener("click", function (e) { if (e.target === backdrop) backdrop.classList.remove("open"); });

      document.getElementById("paySel").innerHTML = LT_DATA.members.map(function (m) {
        return "<option>" + m.name + "</option>";
      }).join("");

      var plan = LT_DATA.plans[0];
      var chipHost = document.getElementById("planChips");
      chipHost.innerHTML = LT_DATA.plans.map(function (pl, i) {
        return '<button type="button" class="chip' + (i === 0 ? " active" : "") + '" data-i="' + i + '">' + pl.label + (pl.note ? " · " + pl.note : "") + "</button>";
      }).join("");
      document.getElementById("payAmt").value = plan.amount;
      chipHost.addEventListener("click", function (e) {
        var btn = e.target.closest(".chip");
        if (!btn) return;
        plan = LT_DATA.plans[+btn.dataset.i];
        chipHost.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("active", c === btn); });
        document.getElementById("payAmt").value = plan.amount;
      });

      document.getElementById("payForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var d = new FormData(this);
        var member = LT_DATA.members.find(function (m) { return m.name === d.get("member"); });
        var prog = member && LT_DATA.programs.find(function (p) { return p.id === member.program; });
        var list = LT.store.read("payments", []);
        list.unshift({
          name: d.get("member"), type: "Membership",
          detail: plan.label + (prog ? " · " + prog.name : ""),
          amount: +d.get("amount") || plan.amount, mode: d.get("mode"), on: LT.today(),
        });
        LT.store.write("payments", list);
        backdrop.classList.remove("open");
        LT.toast("Payment recorded ✓");
        paintKPIs();
        render();
      });

      paintKPIs();
      render();
    })();
  </script>
</body>
</html>
